<form #commentForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
  <textarea name="commentContent" #content="ngModel" [(ngModel)]="text"
            rows="3" required minlength="10" maxlength="300"
            [placeholder]="comment().isReplying ? 'Write a reply…' : 'Share your thoughts…'"
            class="input resize-y" [class.input-invalid]="content.invalid && content.touched"></textarea>

  <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
    @if (content.invalid && content.touched) {
      <p class="text-sm text-red-600">{{ content.hasError('required') ? "You can't save an empty comment" : 'Must be between 10-300 characters' }}</p>
    } @else {
      <p class="text-xs text-muted">{{ text.length }} / 300</p>
    }

    <div class="flex gap-2">
      @if (cancellable()) {
        <button type="button" class="btn btn-ghost btn-sm" (click)="cancelled.emit()">Cancel</button>
      }
      <button type="submit" class="btn btn-primary btn-sm" [disabled]="commentForm.invalid || saving()">
        {{ saving() ? 'Saving…' : comment().blogCommentId > 0 ? 'Save' : comment().isReplying ? 'Reply' : 'Post comment' }}
      </button>
    </div>
  </div>
</form>
