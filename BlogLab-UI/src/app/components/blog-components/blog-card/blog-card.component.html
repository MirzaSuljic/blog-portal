<a [routerLink]="['/blogs', blog().blogId]"
   class="group card flex h-full flex-col overflow-hidden transition duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-ink/5">

  <div class="relative aspect-[16/10] overflow-hidden bg-accent-soft">
    @if (blogPhotoUrl(); as url) {
      <img [src]="url" [alt]="blog().title" loading="lazy"
           class="size-full object-cover transition duration-500 group-hover:scale-105">
    } @else {
      <div class="grid size-full place-items-center bg-linear-to-br from-accent-soft via-orange-50 to-stone-100">
        <span class="font-display text-7xl font-semibold text-accent/40">{{ blog().title.charAt(0) }}</span>
      </div>
    }
  </div>

  <div class="flex flex-1 flex-col p-6">
    <p class="text-xs font-medium text-muted">
      {{ blog().publishDate | date: 'MMM d, y' }} · {{ blog().content | readTime }}
    </p>
    <h3 class="mt-2 font-display text-xl leading-snug font-semibold decoration-accent/40 decoration-2 underline-offset-4 group-hover:underline">
      {{ blog().title }}
    </h3>
    <p class="mt-3 line-clamp-3 text-sm leading-6 text-muted">{{ blog().content | summary: 220 }}</p>

    <div class="mt-auto flex items-center gap-3 pt-6">
      <span class="avatar size-8 text-[11px]">{{ blog().username | initials }}</span>
      <span class="text-sm font-semibold">{{ blog().username }}</span>
    </div>
  </div>
</a>
